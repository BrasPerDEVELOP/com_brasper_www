# HTTP bootstrap. Issue the staging certificate before enabling staging-https.conf.
server {
    listen 80;
    server_name staging.brasper.com;
    root /var/www/com_brasper_www_staging/current;
    index index.html;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "no-store" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }
    location ~ /\. { deny all; }
    location /assets/ { try_files $uri =404; }
    location / { try_files $uri $uri/ $uri.html /index.html; }
}

