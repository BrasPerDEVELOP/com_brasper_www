# Include in the production HTTPS server for brasper.com and www.brasper.com.
# Serve the standalone HTML pages before the Vue app's fallback.

location = /manuel_echeverre {
    alias /var/www/com_brasper_www/dist/manuel_echeverre/index.html;
    default_type text/html;
    charset utf-8;
}

location = /valeria_felipe {
    alias /var/www/com_brasper_www/dist/valeria_felipe/index.html;
    default_type text/html;
    charset utf-8;
}
