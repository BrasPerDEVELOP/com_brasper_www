# Include only inside the HTTPS server for brasper.com / www.brasper.com.
# /var/www/com_brasper_www_staging/promocion is a symlink to current.
location = /promocion {
    return 302 /promocion/$is_args$args;
}

location ^~ /promocion/assets/ {
    root /var/www/com_brasper_www_staging;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "no-store" always;
    location ~ /\. { deny all; }
    try_files $uri =404;
}

location ^~ /promocion/ {
    root /var/www/com_brasper_www_staging;
    index index.html;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "no-store" always;
    location ~ /\. { deny all; }
    try_files $uri $uri/ $uri.html /promocion/index.html;
}
