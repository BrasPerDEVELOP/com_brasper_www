server {
    listen 80;
    server_name staging.brasper.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / { return 301 https://staging.brasper.com$request_uri; }
}

server {
    listen 443 ssl;
    server_name staging.brasper.com;
    ssl_certificate /etc/letsencrypt/live/staging.brasper.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.brasper.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/com_brasper_www_staging/current;
    index index.html;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "no-store" always;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }
    location ~ /\. { deny all; }
    location /assets/ { try_files $uri =404; }
    location / { try_files $uri $uri/ $uri.html /index.html; }
}

