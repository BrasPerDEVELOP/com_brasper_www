# Compatibility redirects: the test web is now served from brasper.com/promocion/.
server {
    listen 80;
    server_name staging.brasper.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location /promocion/ { return 302 https://brasper.com$request_uri; }
    location / { return 302 https://brasper.com/promocion$request_uri; }
}

server {
    listen 443 ssl;
    server_name staging.brasper.com;
    ssl_certificate /etc/letsencrypt/live/staging.brasper.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.brasper.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    location /promocion/ { return 302 https://brasper.com$request_uri; }
    location / { return 302 https://brasper.com/promocion$request_uri; }
}
